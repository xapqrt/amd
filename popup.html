<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Web-Scapes</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="wrap">
    <div id="domain" class="domain">loading domain...</div>
    
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
      <select id="track" style="flex: 1; margin-right: 10px;"></select>
      <div id="visualizer" class="visualizer">
        <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
      </div>
    </div>
    
    <div id="status" class="status">listening...</div>
    
    <div class="controls-group">
      <div>
        <label class="volLabel" for="vol" style="margin-top:0;">Master Volume</label>
        <input id="vol" type="range" min="0" max="100" value="22" />
      </div>
      
      <label class="checkbox-label"><input id="globalMute" type="checkbox" /> Global Mute</label>
      <label class="checkbox-label"><input id="mute" type="checkbox" /> Mute This Domain</label>
    </div>
    
    <button id="openSettings" class="settingsBtn">Open Full Settings</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
